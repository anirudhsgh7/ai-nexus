[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Default run is the offline unit suite; select integration explicitly with
# `pytest -q -m integration` (CLI -m overrides this addopts).
addopts = -m "not integration"
markers =
    integration: tests requiring a live Ollama instance (auto-skipped when unreachable)
